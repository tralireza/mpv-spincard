# spincard options — deploy to ~/.mpv/script-opts/spincard.conf
# Values shown are the defaults.

# Show the card automatically when a file loads.
auto_show=yes

# Pop the card while paused, hide on resume (off by default).
show_on_pause=no

# Auto-show-on-open timeout in seconds (0 = stay until toggled off).
duration=7

# Toggle-key auto-close timeout in seconds (0 = stay until toggled off).
toggle_timeout=17

# Default toggle key. Leave empty and bind from input.conf instead:
#   c script-binding spincard/toggle
# Over tmux/SSH use a PLAIN key — Ctrl+<letter> collides with Tab/Enter/Esc.
key=

# Card top-left position in a 1280x720 virtual coordinate space.
pos_x=40
pos_y=40

# --- Online metadata (TMDB, per Docs/MpvLuaMetadataApiProvider.md) ---
# Enrich the card with title/overview/rating from TMDB. Needs api_key below.
enrich=yes

# TMDB API key — get one free at https://www.themoviedb.org/settings/api
# Empty => card shows filename-parsed identity + local file details only.
api_key=

# TMDB response language.
language=en-US

# Rating is treated as a DYNAMIC property: with an api_key set, re-fetch it from
# TMDB once the cached value is older than this many seconds (default 1h). This
# applies to every card — even a local .nfo card gets a live TMDB rating, while
# the rest of the card stays from the .nfo. 0 = off (use the source rating only).
rating_ttl=3600

# --- IMDb rating (via the OMDb API) ---
# Show the IMDb rating too. IMDb has no free public API, so this uses OMDb
# (https://www.omdbapi.com/) as the vehicle. Free key (~1000 req/day):
# http://www.omdbapi.com/apikey.aspx. Empty => IMDb off. When BOTH this and api_key
# are set, the card shows IMDb as the headline rating with TMDB beside it; with only
# one key set, that source is shown alone. Looked up by IMDb id (tt…) from a local
# .nfo <uniqueid> or TMDB's external_ids, falling back to a title(+year) search.
# Refreshed on the same rating_ttl cadence as the TMDB rating.
omdb_api_key=

# Show the IMDb vote count next to the rating (e.g. 8.1 (1.2M)).
imdb_votes=yes

# Fill a local .nfo's MISSING body fields (cast, genres, studio, tagline,
# director, runtime, certification) from TMDB — e.g. TV episode .nfos never carry
# genres/studio/certification, and some .nfos omit the cast. Fill-only: a value
# the .nfo already provides is NEVER overwritten. Prefers the .nfo's <uniqueid>
# tmdb id for an exact match, else the same title/year search used for cards with
# no .nfo. Cached separately (extra/<key>), so the .nfo stays authoritative.
# Needs api_key + enrich. no = only cards WITHOUT a .nfo get the richer fields.
nfo_supplement=yes

# Max cast entries on the card, rendered "Name (Role)". Also the pool size cycled
# when cast_scroll is on.
cast_max=5

# Cast font size and weight (applies to both the packed and scrolling layouts).
# 21 = the card's body tier (matches genre/synopsis/meta) for a uniform look.
cast_fs=21
cast_bold=yes

# Scroll the cast (a marquee) instead of packing names onto <=2 rows. no = packed
# layout. Style is set by cast_scroll_dir. Timer-driven, so it also animates while
# paused. Only scrolls when there is more cast than fits.
cast_scroll=yes
#
# cast_scroll_dir: how the marquee moves.
#   horizontal - a single line of comma-separated "Name (Role)" gliding left like
#                a news ticker (cast_scroll_px per tick, every cast_scroll_interval
#                seconds; smaller px / interval = smoother; seamless loop).
#   vertical   - a fixed cast_lines x cast_cols grid of "Name (Role)" cells (the
#                2nd column starts at the card's middle), scrolling a row at a time
#                every cast_scroll_secs.
cast_scroll_dir=horizontal
cast_scroll_px=3
cast_scroll_interval=0.1
cast_scroll_secs=2.5
cast_lines=2
cast_cols=2

# Scroll the plot/synopsis through a fixed overview_lines window, one wrapped line
# every overview_scroll_secs, wrapping (only when the synopsis is taller than the
# window). Timer-driven, so it animates while paused too. no = static, wrapped to
# overview_lines. overview_scroll_delay holds the FIRST window this many seconds
# before scrolling starts, so the opening line stays readable (0 = start at once).
overview_scroll=yes
overview_scroll_secs=3
overview_scroll_delay=3
overview_lines=4

# Certification region for the age rating/MPAA (ISO-3166-1, e.g. US, GB, DE).
# Empty => derive from `language` (en-US → US, en-GB → GB; fallback US).
region=

# --- Live TV (Tvheadend EPG) ---
# When the played URL is a Tvheadend stream (…/stream/channel…), show the
# current programme from Tvheadend's EPG instead of a movie/TV card. The channel
# is resolved from the URL's channelid via Tvheadend's playlist (/playlist/
# channels, where tvg-id is the channel UUID), falling back to the channel name
# (mpv's media-title). Set to your server's base URL to enable; empty = off.
# Embed credentials in the URL if your server needs them (http://user:pass@host:9981).
tvheadend_url=

# Live TV: how many upcoming programmes to keep for the "Up next" heading (the
# pool). 0 hides the list; each row shows the start time and (truncated) title.
# The list shows a live_upcoming_lines window that scrolls UP one row every
# live_upcoming_secs (after holding live_upcoming_delay s) when the pool is bigger,
# same as the synopsis marquee.
live_upcoming=7
live_upcoming_lines=3
live_upcoming_secs=1.5
live_upcoming_delay=3

# Live TV: show the tuner's signal strength / SNR as a colour-coded bar meter on
# the card (plus a BER/UNC clean-or-errors cue and the channel bitrate). Reads
# Tvheadend's tuner status (needs tvheadend_url); values are scale-aware (dB/dBm
# or %). Shown only when the tuner reports RF telemetry — non-DVB / IPTV channels
# omit the row. no = never show it.
live_signal=yes

# Live TV: seconds between signal polls while the card is visible; the meter
# updates in place on this cadence. 0 = read once when the card appears (no
# periodic poll).
live_signal_interval=3

# Live TV: the signal strength (in dBm) that fills the signal meter completely.
# The meter spans 50 dB below this (so signal_dbm_max-50 = empty). Set this to
# your tuner's real maximum: sample a few strong channels and use the highest
# dBm you see. Default -40.6 is the observed ceiling of a Montage DS3000 on
# Astra 28.2E (that driver reports a near-static signal, so SNR is the metric
# that actually varies). Only affects tuners that report signal in dBm.
signal_dbm_max=-40.6

# --- Local poster image (needs ffmpeg) ---
# Draw the poster.jpg / folder.jpg / <name>.jpg next to the file, top-right.
show_poster=yes
# Poster height as a fraction of the video height.
poster_height=0.42
# Cap the poster width as a fraction of OSD width (0 = no cap). Reins in wide 16:9
# TV episode thumbs (…-thumb.jpg) so they don't spill over the card; portrait
# movie posters are already narrower than this, so they're unaffected. Relative to
# the live output size, so it holds at 1080p, 4K, and in a resized window.
poster_max_width=0.30
# Gap from the top-right corner (fraction of height; 0 = flush to the corner).
poster_margin=0.02

# --- Local file details (all from mpv properties, no external tools) ---
# codec / HDR / fps / resolution, audio+subtitle languages, chapters, size,
# and live resume %/ETA.
show_tech=yes

# --- Fanart backdrop (needs ffmpeg) ---
# Dimmed full-frame backdrop from fanart.jpg / <name>-fanart.jpg / backdrop.jpg
# (Kodi/Emby). Note: mpv draws image overlays ABOVE text, so it tints the card.
# Default is a STATIC backdrop held at fanart_opacity (a subtle 0.25 tint; raise
# toward 0.6 for a darker, more prominent backdrop, lower for barely-there).
show_fanart=yes
fanart_opacity=0.25

# Only show the fanart while playback is PAUSED (and the card is up); hide it the
# moment you resume. no = show the backdrop whenever the card is shown.
fanart_pause_only=yes

# Card anchor: "bottom" (hug the bottom edge, grow up) or "top".
anchor=bottom

# --- Banner (wide title art, top-left; opaque JPEG) ---
show_banner=yes
banner_height=0.10

# --- Clearlogo (transparent title logo in the card's title slot) ---
show_logo=yes
logo_height=0.12

# Crop the clearlogo's transparent margins (via ffmpeg cropdetect over its alpha
# plane) so the reserved title slot maps to the real artwork instead of the PNG's
# variable padding — this keeps a consistent gap below the logo and stops the row
# beneath it (year/tagline) from overlapping tightly-cropped logos. Falls back to
# a plain decode if detection finds nothing. no = decode the logo as-is.
logo_autocrop=yes

# Remote artwork fallback: when NO local poster/fanart/clearlogo file sits beside
# the media, fetch the TMDB-hosted image the card already carries (poster_path /
# backdrop_path / logos) and run it through the same decode path. Needs api_key +
# network; each is best-effort (offline/404 falls back cleanly). no = local art only.
remote_art=yes

# --- Disc art (3/4 disc nestled at the card's top-left corner) ---
show_disc=yes
disc_size=0.22
# Spin the disc while the card is showing.
disc_spin=yes
# Seconds per full rotation (higher = slower).
disc_spin_secs=5
# Rotation frames (more = smoother; larger temp file).
disc_spin_frames=96
