# spincard options — deploy to ~/.mpv/script-opts/spincard.conf
# Values shown are the defaults.

# Show the card automatically when a file loads.
auto_show=yes

# Pop the card while paused, hide on resume (off by default).
show_on_pause=no

# Auto-show-on-open timeout in seconds (0 = stay until toggled off).
duration=7

# Toggle-key auto-close timeout in seconds (0 = stay until toggled off).
toggle_timeout=17

# Default toggle key. Leave empty and bind from input.conf instead:
#   c script-binding spincard/toggle
# Over tmux/SSH use a PLAIN key — Ctrl+<letter> collides with Tab/Enter/Esc.
key=

# Card top-left position in a 1280x720 virtual coordinate space.
pos_x=40
pos_y=40

# --- Online metadata (TMDB, per Docs/MpvLuaMetadataApiProvider.md) ---
# Enrich the card with title/overview/rating from TMDB. Needs api_key below.
enrich=yes

# TMDB API key — get one free at https://www.themoviedb.org/settings/api
# Empty => card shows filename-parsed identity + local file details only.
api_key=

# TMDB response language.
language=en-US

# Rating is treated as a DYNAMIC property: with an api_key set, re-fetch it from
# TMDB once the cached value is older than this many seconds (default 1h). This
# applies to every card — even a local .nfo card gets a live TMDB rating, while
# the rest of the card stays from the .nfo. 0 = off (use the source rating only).
rating_ttl=3600

# --- Live TV (Tvheadend EPG) ---
# When the played URL is a Tvheadend stream (…/stream/channel…), show the
# current programme from Tvheadend's EPG instead of a movie/TV card. The channel
# is resolved from the URL's channelid via Tvheadend's playlist (/playlist/
# channels, where tvg-id is the channel UUID), falling back to the channel name
# (mpv's media-title). Set to your server's base URL to enable; empty = off.
# Embed credentials in the URL if your server needs them (http://user:pass@host:9981).
tvheadend_url=

# Live TV: how many upcoming programmes to list under the "Up next" heading.
# 0 hides the list; each row shows the start time and (truncated) title.
live_upcoming=3

# Live TV: show the tuner's signal strength / SNR as a colour-coded bar meter on
# the card (plus a BER/UNC clean-or-errors cue and the channel bitrate). Reads
# Tvheadend's tuner status (needs tvheadend_url); values are scale-aware (dB/dBm
# or %). Shown only when the tuner reports RF telemetry — non-DVB / IPTV channels
# omit the row. no = never show it.
live_signal=yes

# Live TV: seconds between signal polls while the card is visible; the meter
# updates in place on this cadence. 0 = read once when the card appears (no
# periodic poll).
live_signal_interval=3

# Live TV: the signal strength (in dBm) that fills the signal meter completely.
# The meter spans 50 dB below this (so signal_dbm_max-50 = empty). Set this to
# your tuner's real maximum: sample a few strong channels and use the highest
# dBm you see. Default -40.6 is the observed ceiling of a Montage DS3000 on
# Astra 28.2E (that driver reports a near-static signal, so SNR is the metric
# that actually varies). Only affects tuners that report signal in dBm.
signal_dbm_max=-40.6

# --- Local poster image (needs ffmpeg) ---
# Draw the poster.jpg / folder.jpg / <name>.jpg next to the file, top-right.
show_poster=yes
# Poster height as a fraction of the video height.
poster_height=0.42
# Gap from the top-right corner (fraction of height; 0 = flush to the corner).
poster_margin=0.02

# --- Local file details (all from mpv properties, no external tools) ---
# codec / HDR / fps / resolution, audio+subtitle languages, chapters, size,
# and live resume %/ETA.
show_tech=yes

# --- Fanart backdrop (needs ffmpeg) ---
# Dimmed full-frame backdrop from fanart.jpg / <name>-fanart.jpg / backdrop.jpg
# (Kodi/Emby). Note: mpv draws image overlays ABOVE text, so it tints the card.
show_fanart=yes
fanart_opacity=0.6

# Auto-hide the fanart backdrop this many seconds after it appears, leaving the
# rest of the card in place (0 = keep it for as long as the card is shown).
fanart_timeout=3

# Fade the fanart in (from 0.1 up to fanart_opacity) then back down to 0.1 — a
# faint backdrop that then stays — across fanart_timeout, instead of a hard
# show/hide. fanart_fade_frames is the fade
# smoothness — more pre-rendered opacity steps = smoother, but a larger temp
# file and more work per frame (full-frame fades can be heavy on low-end GPUs).
# Can also be flipped at runtime — bind spincard/toggle-fanart-fade in input.conf.
fanart_fade=yes
fanart_fade_frames=16

# Card anchor: "bottom" (hug the bottom edge, grow up) or "top".
anchor=bottom

# --- Banner (wide title art, top-left; opaque JPEG) ---
show_banner=no
banner_height=0.10

# --- Clearlogo (transparent title logo in the card's title slot) ---
show_logo=yes
logo_height=0.12

# Crop the clearlogo's transparent margins (via ffmpeg cropdetect over its alpha
# plane) so the reserved title slot maps to the real artwork instead of the PNG's
# variable padding — this keeps a consistent gap below the logo and stops the row
# beneath it (year/tagline) from overlapping tightly-cropped logos. Falls back to
# a plain decode if detection finds nothing. no = decode the logo as-is.
logo_autocrop=yes

# --- Disc art (3/4 disc nestled at the card's top-left corner) ---
show_disc=yes
disc_size=0.22
disc_spin=yes         # spin the disc while the card is showing
disc_spin_secs=2.5    # seconds per full rotation (higher = slower)
disc_spin_frames=96   # rotation frames (more = smoother; larger temp file)
